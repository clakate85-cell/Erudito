if(G.m!=="all"&&sc>0){S.top.push({s:sc,m:MODES[G.m][0],d:new Date().toLocaleDateString("it-IT")});S.top.sort((a,b)=>b.s-a.s);S.top=S.top.slice(0,10)}
save();
const win=G.pl?(G.pl[0]===G.pl[1]?"Pareggio!":`Vince il Giocatore ${G.pl[0]>G.pl[1]?1:2}!`):"";
const txt=`${NAME} ${G.dk}: ${G.ok}/${tot} corrette, ${sc} punti!`;
show(`<h2>Partita finita</h2>${win?`<div class="card"><b>${win}</b> ${G.pl[0]} – ${G.pl[1]}</div>`:""}
<div class="card"><p style="font-size:2rem;margin:0"><b>${sc}</b> punti</p><p class="s">${G.ok} risposte corrette su ${tot} · serie migliore ${G.maxS}</p>
<p>+${xp} XP · Livello ${lvl(S.xp)}${lvl(S.xp)>oldL?" 🎉 nuovo livello!":""}</p></div>
${G.m==="day"?`<button class="b" onclick="shr('${esc(txt)}')">📤 Condividi il punteggio</button>`:""}
<button class="b p" onclick="setup('${G.m}')">Gioca ancora</button>${nav}`)}
function shr(t){try{navigator.share?navigator.share({text:t}):navigator.clipboard.writeText(t).then(()=>alert("Copiato negli appunti"))}catch(e){alert(t)}}

function profile(){clearInterval(tmr);
const acc=S.tot?Math.round(100*S.ok/S.tot):0,cs=Object.entries(S.cat).filter(([,v])=>v.t>=1).map(([k,v])=>[k,Math.round(100*v.c/v.t),v.t]).sort((a,b)=>b[1]-a[1]);
show(`<h2>Profilo</h2><div class="card"><b>Livello ${lvl(S.xp)}</b> · ${S.xp} XP<div class="bar"><i style="width:${Math.min(100,100*(S.xp-40*(lvl(S.xp)-1)**2)/(40*(2*lvl(S.xp)-1)))}%"></i></div>
Partite: ${S.games} · Risposte corrette: ${acc}% (${S.ok}/${S.tot}) · Serie record: ${S.maxStreak}</div>
<h3>Categorie</h3><div class="card">${cs.length?cs.map(c=>`${CATS[c[0]][1]} ${CATS[c[0]][0]}: <b>${c[1]}%</b> (${c[2]} dom.)`).join("<br>"):"Gioca per vedere le statistiche."}</div>
<h3>Badge</h3><div class="card">${BADGES.map(b=>b[1](S)?"🏅 "+b[0]:"🔒 "+b[0]).join("<br>")}</div>
<h3>Classifica locale</h3><div class="card">${S.top.length?S.top.map((t,i)=>`${i+1}. <b>${t.s}</b> · ${t.m} · ${t.d}`).join("<br>"):"Ancora nessun punteggio."}</div>
<h3>Impostazioni</h3><button class="b" onclick="S.audio=S.audio===false;save();profile()">🔊 Domande audio: ${S.audio===false?"disattivate":"attivate"}</button><div class="row"><button class="b" onclick="S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];theme();save();profile()">Tema: ${{auto:"automatico",light:"chiaro",dark:"scuro"}[S.theme]}</button><button class="b" onclick="if(confirm('Cancellare tutti i progressi?')){try{localStorage.removeItem('erudito')}catch(e){}location.reload()}">Azzera dati</button></div>
<button class="b p" onclick="home()">← Home</button>`)}
document.addEventListener("keydown",e=>{if(G&&!G.locked&&"1234".includes(e.key)&&e.key)pick(+e.key-1)});
home();
</script></body></html>
